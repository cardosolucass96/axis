version: "3.7"

services:
  axis-backend:
    image: ghcr.io/cardosolucass96/axis/axis-backend:latest
    # Para build local, descomente:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    networks:
      - CardosoNet
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=https://axis.cardosolucas.com
      - SESSION_SECRET=${SESSION_SECRET:-sua_chave_secreta_muito_segura_aqui_123}
      - GOOGLE_REDIRECT_URI=https://axis.cardosolucas.com/api/auth/google/callback
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - axis-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.axis-backend.rule=Host(`axis.cardosolucas.com`) && PathPrefix(`/api`)
        - traefik.http.routers.axis-backend.entrypoints=websecure
        - traefik.http.routers.axis-backend.priority=2
        - traefik.http.routers.axis-backend.tls.certresolver=letsencryptresolver
        - traefik.http.services.axis-backend.loadbalancer.passHostHeader=true
        - traefik.http.services.axis-backend.loadbalancer.server.port=3000

  axis-frontend:
    image: ghcr.io/cardosolucass96/axis/axis-frontend:latest
    # Para build local, descomente:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    #   args:
    #     - VITE_API_URL=https://axis.cardosolucas.com/api
    #     - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - CardosoNet
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.axis-frontend.rule=Host(`axis.cardosolucas.com`)
        - traefik.http.routers.axis-frontend.entrypoints=websecure
        - traefik.http.routers.axis-frontend.priority=1
        - traefik.http.routers.axis-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.services.axis-frontend.loadbalancer.passHostHeader=true
        - traefik.http.services.axis-frontend.loadbalancer.server.port=80

networks:
  CardosoNet:
    external: true

volumes:
  axis-data:
    driver: local
